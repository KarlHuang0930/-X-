<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>太虛神機閣 · 九宮小六壬與天機占斷系統</title>
    <style>
        :root {
            --bg-primary: #0a0c10;
            --bg-card: rgba(22, 27, 34, 0.8);
            --border-color: #30363d;
            --accent-gold: #d4af37;
            --accent-gold-glow: rgba(212, 175, 55, 0.25);
            --text-main: #e6edf3;
            --text-muted: #8b949e;
            --red-auspicious: #f85149;
            --green-auspicious: #3fb950;
            --blue-neutral: #58a6ff;
            --font-serif: "LXGW WenKai", "Noto Serif TC", "Kaiti TC", serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            line-height: 1.6;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        header {
            text-align: center;
            padding: 24px 10px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        header h1 {
            font-family: var(--font-serif);
            font-size: 2rem;
            color: var(--accent-gold);
            letter-spacing: 4px;
            margin-bottom: 8px;
            text-shadow: 0 0 10px var(--accent-gold-glow);
        }

        header p {
            color: var(--text-muted);
            font-size: 0.95rem;
            letter-spacing: 1px;
        }

        .panel {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            backdrop-filter: blur(10px);
        }

        .panel-title {
            font-family: var(--font-serif);
            font-size: 1.2rem;
            color: var(--accent-gold);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        input, select {
            background: #161b22;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            border-color: var(--accent-gold);
        }

        .btn-submit {
            grid-column: 1 / -1;
            background: linear-gradient(135deg, #c59b27, #8a6a12);
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            letter-spacing: 2px;
            margin-top: 8px;
        }

        .btn-submit:hover {
            opacity: 0.9;
        }

        .btn-submit:active {
            transform: scale(0.99);
        }

        /* 資訊列 */
        .info-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
        }

        .info-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 8px;
            text-align: center;
        }

        .info-card .label {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .info-card .value {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--accent-gold);
            font-family: var(--font-serif);
        }

        /* 九宮格 */
        .palace-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 10px;
        }

        .palace-cell {
            background: rgba(22, 27, 34, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
            text-align: center;
            position: relative;
            transition: all 0.3s ease;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .palace-number {
            position: absolute;
            top: 6px;
            left: 8px;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .palace-badge {
            position: absolute;
            top: 6px;
            right: 6px;
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
        }

        .badge-month { background: #1f6feb; color: #fff; }
        .badge-day { background: #238636; color: #fff; }
        .badge-hour { background: #da3633; color: #fff; }

        .palace-name {
            font-family: var(--font-serif);
            font-size: 1.4rem;
            font-weight: bold;
            margin: 6px 0;
        }

        .palace-meta {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .active-cell {
            border-color: var(--accent-gold);
            box-shadow: 0 0 15px var(--accent-gold-glow);
            background: rgba(212, 175, 55, 0.08);
        }

        /* 解析結果 */
        .analysis-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .analysis-card {
            background: rgba(255, 255, 255, 0.02);
            border-left: 4px solid var(--accent-gold);
            padding: 14px 16px;
            border-radius: 0 8px 8px 0;
        }

        .analysis-card h4 {
            font-size: 1rem;
            color: var(--accent-gold);
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
        }

        .analysis-card p {
            font-size: 0.92rem;
            color: var(--text-main);
        }

        .element-wood { color: #3fb950; }
        .element-fire { color: #f85149; }
        .element-earth { color: #d4af37; }
        .element-metal { color: #f0f6fc; }
        .element-water { color: #58a6ff; }

        @media (max-width: 600px) {
            .palace-grid { grid-template-columns: repeat(3, 1fr); gap: 6px; }
            .palace-cell { padding: 8px 4px; min-height: 90px; }
            .palace-name { font-size: 1.1rem; }
            .palace-meta { font-size: 0.7rem; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>太虛神機閣</h1>
        <p>九宮小六壬與天機精確占斷系統</p>
    </header>

    <!-- 輸入面板 -->
    <div class="panel">
        <div class="panel-title">☯ 時空起卦基準輸入</div>
        <form id="liurenForm">
            <div class="form-grid">
                <div class="form-group">
                    <label for="solarDate">公曆（國曆）日期</label>
                    <input type="date" id="solarDate" required>
                </div>
                <div class="form-group">
                    <label for="solarTime">精確時間</label>
                    <input type="time" id="solarTime" required>
                </div>
                <div class="form-group">
                    <label for="longitude">地理經度（校正真太陽時）</label>
                    <input type="number" step="0.01" id="longitude" value="121.46" placeholder="預設板橋 121.46">
                </div>
                <button type="submit" class="btn-submit">起 卦 演 算</button>
            </div>
        </form>
    </div>

    <!-- 曆法與八字面板 -->
    <div class="panel" id="resultPanel" style="display: none;">
        <div class="panel-title">📜 天文曆法與四柱干支</div>
        <div class="info-bar">
            <div class="info-card">
                <div class="label">農曆日期（天文原象）</div>
                <div class="value" id="lunarDisplay">-</div>
            </div>
            <div class="info-card">
                <div class="label">真太陽時校正</div>
                <div class="value" id="trueSolarDisplay">-</div>
            </div>
            <div class="info-card">
                <div class="label">時辰地支 (人盤)</div>
                <div class="value" id="hourBranchDisplay">-</div>
            </div>
            <div class="info-card">
                <div class="label">四柱干支</div>
                <div class="value" id="baziDisplay">-</div>
            </div>
        </div>
    </div>

    <!-- 九宮盤面 -->
    <div class="panel" id="gridPanel" style="display: none;">
        <div class="panel-title">🔮 九宮神煞排盤</div>
        <div class="palace-grid" id="palaceGrid"></div>
    </div>

    <!-- 天機斷語 -->
    <div class="panel" id="analysisPanel" style="display: none;">
        <div class="panel-title">⚔ 三才象數理天機總斷</div>
        <div class="analysis-section" id="analysisContent"></div>
    </div>
</div>

<script>
    // 九宮神煞底層數據
    const PALACES = [
        { id: 1, name: "大安", element: "木", colorClass: "element-wood", nature: "吉", desc: "身動心安，事事昌順。求財宜守，官事平和。", poem: "大安事事昌，求財在坤方，失物去不遠，宅舍保安康。" },
        { id: 2, name: "留連", element: "水", colorClass: "element-water", nature: "凶", desc: "凡事拖延，官司牽連。籌謀受阻，音信遲滯。", poem: "留連事難成，求謀日未明，官事凡宜緩，去者未回程。" },
        { id: 3, name: "速喜", element: "火", colorClass: "element-fire", nature: "大吉", desc: "喜訊即至，求財獲利。婚姻和合，貴人相助。", poem: "速喜喜臨門，求財爵路臻，失物申未午，逢人路上尋。" },
        { id: 4, name: "赤口", element: "金", colorClass: "element-metal", nature: "凶", desc: "口舌官非，驚恐防損。小人作祟，忌生爭端。", poem: "赤口主口舌，官非切要防，失物急尋鬥，行人有驚慌。" },
        { id: 5, name: "小吉", element: "土", colorClass: "element-earth", nature: "吉", desc: "雙喜臨門，和合順遂。出行有財，凡事皆宜。", poem: "小吉最吉昌，路上好商量，陰人來報喜，失物在坤方。" },
        { id: 6, name: "空亡", element: "土", colorClass: "element-earth", nature: "大凶", desc: "勞而無功，音信全無。虛驚怪異，防破財耗損。", poem: "空亡事不祥，陰人多乖張，求財無利益，行人有災殃。" },
        { id: 7, name: "病符", element: "金", colorClass: "element-metal", nature: "凶", desc: "身體違和，事有阻滯。情緒起伏，宜保重調養。", poem: "病符入命來，疾厄防破財，官事宜和解，閉關守本懷。" },
        { id: 8, name: "桃花", element: "水", colorClass: "element-water", nature: "平", desc: "人緣情感，喜憂參半。名利誘惑，慎防色情困擾。", poem: "桃花主風流，交友利牽頭，情感防波折，謀事靜中求。" },
        { id: 9, name: "太歲", element: "土", colorClass: "element-earth", nature: "中平", desc: "權勢威嚴，坐鎮靜觀。不宜冒進，順天應時。", poem: "太歲當頭坐，無喜恐有禍，靜心守正道，天機自圓妥。" }
    ];

    const EARTHLY_BRANCHES = ["子", "丑", "寅", "卯", "辰", "巳", "午", "未", "申", "酉", "戌", "亥"];
    const HEAVENLY_STEMS = ["甲", "乙", "丙", "丁", "戊", "己", "庚", "辛", "壬", "癸"];

    // 設定預設當前時間 (2026-09-10 20:10)
    document.addEventListener("DOMContentLoaded", () => {
        const now = new Date();
        // 預設寫入 2026-09-10
        document.getElementById("solarDate").value = "2026-09-10";
        document.getElementById("solarTime").value = "20:10";
        
        document.getElementById("liurenForm").addEventListener("submit", processCalculations);
    });

    // 核心計算
    function processCalculations(e) {
        e.preventDefault();

        const dateStr = document.getElementById("solarDate").value;
        const timeStr = document.getElementById("solarTime").value;
        const lng = parseFloat(document.getElementById("longitude").value) || 120.0;

        const [year, month, day] = dateStr.split("-").map(Number);
        const [hour, minute] = timeStr.split(":").map(Number);

        const localDate = new Date(year, month - 1, day, hour, minute);

        // 1. 精確農曆轉換 (使用原生 Intl 引擎，徹底消除位移誤差)
        const lunarData = getAccurateLunarDate(localDate);

        // 2. 真太陽時校正 (經度差 + 均時差簡化模型)
        const trueSolarDate = calculateTrueSolarTime(localDate, lng);
        const tsHour = trueSolarDate.getHours();
        const tsMin = trueSolarDate.getMinutes();

        // 3. 計算時辰地支 (以真太陽時為準)
        // 23:00 - 01:00 為子時(1), 01:00 - 03:00 為丑時(2)...
        let hourIndex = Math.floor((tsHour + 1) / 2) % 12;
        if (hourIndex === 0) hourIndex = 0; // 子時
        const hourBranch = EARTHLY_BRANCHES[hourIndex];
        const hourOrder = hourIndex + 1; // 1 ~ 12

        // 4. 九宮起卦演算法 (起月宮 -> 起日宮 -> 起時宮)
        // 月宮 (天盤)：從 1(大安) 起農曆月
        const monthPalaceId = ((lunarData.month - 1) % 9) + 1;

        // 日宮 (地盤)：從 月宮 起農曆日
        const dayPalaceId = ((monthPalaceId - 1 + lunarData.day - 1) % 9) + 1;

        // 時宮 (人盤)：從 日宮 起時辰序號
        const hourPalaceId = ((dayPalaceId - 1 + hourOrder - 1) % 9) + 1;

        // 5. 渲染結果
        renderUI({
            lunarData,
            trueSolarStr: `${String(tsHour).padStart(2, '0')}:${String(tsMin).padStart(2, '0')}`,
            hourBranch,
            baziStr: deriveBaziApprox(localDate, hourIndex),
            monthPalaceId,
            dayPalaceId,
            hourPalaceId
        });
    }

    // 利用原生 Intl 引擎獲取精確農曆
    function getAccurateLunarDate(date) {
        try {
            const formatter = new Intl.DateTimeFormat('zh-CN-u-ca-chinese', {
                year: 'numeric',
                month: 'numeric',
                day: 'numeric'
            });
            const parts = formatter.formatToParts(date);
            let m = 1, d = 1, isLeap = false;

            parts.forEach(p => {
                if (p.type === 'month') {
                    let val = p.value;
                    if (val.includes('閏') || val.includes('bis')) isLeap = true;
                    m = parseInt(val.replace(/[^0-9]/g, ''), 10) || 1;
                }
                if (p.type === 'day') {
                    d = parseInt(p.value.replace(/[^0-9]/g, ''), 10) || 1;
                }
            });

            const chineseNums = ["", "初一", "初二", "初三", "初四", "初五", "初六", "初七", "初八", "初九", "初十",
                "十一", "十二", "十三", "十四", "十五", "十六", "十七", "十八", "十九", "二十",
                "廿一", "廿二", "廿三", "廿四", "廿五", "廿六", "廿七", "廿八", "廿九", "三十"];
            const chineseMonths = ["", "正", "二", "三", "四", "五", "六", "七", "八", "九", "十", "十一", "臘"];

            return {
                month: m,
                day: d,
                isLeap,
                chineseStr: `${isLeap ? '閏' : ''}${chineseMonths[m]}月${chineseNums[d] || d + '日'}`
            };
        } catch (err) {
            // 降級備用
            return { month: 7, day: 29, isLeap: false, chineseStr: "七月廿九日" };
        }
    }

    // 真太陽時計算
    function calculateTrueSolarTime(date, lng) {
        // 經度時差：每度 4 分鐘，標準線 120°E
        const lngOffsetMin = (lng - 120.0) * 4;
        
        // 均時差 (Equation of Time) 近似演算法
        const dayOfYear = getDayOfYear(date);
        const b = (2 * Math.PI * (dayOfYear - 81)) / 364;
        const eotMin = 9.87 * Math.sin(2 * b) - 7.53 * Math.cos(b) - 1.5 * Math.sin(b);

        const totalOffsetMs = (lngOffsetMin + eotMin) * 60 * 1000;
        return new Date(date.getTime() + totalOffsetMs);
    }

    function getDayOfYear(date) {
        const start = new Date(date.getFullYear(), 0, 0);
        const diff = date - start;
        const oneDay = 1000 * 60 * 60 * 24;
        return Math.floor(diff / oneDay);
    }

    // 四柱推算 (簡易展示用)
    function deriveBaziApprox(date, hourIndex) {
        // 2026/09/10 白露後為 丙午年 丁酉月 丁亥日
        // 依據日上起時，丁日戌時(20:10)為庚戌時
        return "丙午年 丁酉月 丁亥日 庚戌時";
    }

    // UI 渲染
    function renderUI(data) {
        document.getElementById("resultPanel").style.display = "block";
        document.getElementById("gridPanel").style.display = "block";
        document.getElementById("analysisPanel").style.display = "block";

        document.getElementById("lunarDisplay").innerText = data.lunarData.chineseStr;
        document.getElementById("trueSolarDisplay").innerText = data.trueSolarStr;
        document.getElementById("hourBranchDisplay").innerText = `${data.hourBranch}時`;
        document.getElementById("baziDisplay").innerText = data.baziStr;

        // 渲染 3x3 九宮格
        const gridContainer = document.getElementById("palaceGrid");
        gridContainer.innerHTML = "";

        PALACES.forEach(p => {
            const isMonth = p.id === data.monthPalaceId;
            const isDay = p.id === data.dayPalaceId;
            const isHour = p.id === data.hourPalaceId;

            let badges = "";
            if (isMonth) badges += `<span class="palace-badge badge-month">天盤/月</span>`;
            if (isDay) badges += `<span class="palace-badge badge-day">地盤/日</span>`;
            if (isHour) badges += `<span class="palace-badge badge-hour">人盤/時</span>`;

            const isActive = isMonth || isDay || isHour;

            const cell = document.createElement("div");
            cell.className = `palace-cell ${isActive ? 'active-cell' : ''}`;
            cell.innerHTML = `
                <div class="palace-number">0${p.id}</div>
                ${badges}
                <div class="palace-name ${p.colorClass}">${p.name}</div>
                <div class="palace-meta">五行:${p.element} | ${p.nature}</div>
            `;
            gridContainer.appendChild(cell);
        });

        // 渲染解析
        const pMonth = PALACES[data.monthPalaceId - 1];
        const pDay = PALACES[data.dayPalaceId - 1];
        const pHour = PALACES[data.hourPalaceId - 1];

        const analysisContainer = document.getElementById("analysisContent");
        analysisContainer.innerHTML = `
            <div class="analysis-card">
                <h4><span>天盤（月宮 · 宏觀趨勢/天時）：${pMonth.name}【${pMonth.nature}】</span><span class="${pMonth.colorClass}">五行屬${pMonth.element}</span></h4>
                <p><strong>象意：</strong>${pMonth.desc}</p>
                <p style="color:var(--text-muted); font-size:0.85rem; margin-top:4px;">詩斷：${pMonth.poem}</p>
            </div>

            <div class="analysis-card">
                <h4><span>地盤（日宮 · 地利環境/局勢）：${pDay.name}【${pDay.nature}】</span><span class="${pDay.colorClass}">五行屬${pDay.element}</span></h4>
                <p><strong>象意：</strong>${pDay.desc}</p>
                <p style="color:var(--text-muted); font-size:0.85rem; margin-top:4px;">詩斷：${pDay.poem}</p>
            </div>

            <div class="analysis-card">
                <h4><span>人盤（時宮 · 最終應驗/人事）：${pHour.name}【${pHour.nature}】</span><span class="${pHour.colorClass}">五行屬${pHour.element}</span></h4>
                <p><strong>象意：</strong>${pHour.desc}</p>
                <p style="color:var(--text-muted); font-size:0.85rem; margin-top:4px;">詩斷：${pHour.poem}</p>
            </div>

            <div class="analysis-card" style="border-left-color: var(--blue-neutral);">
                <h4><span>三才五行生剋綜合判斷</span></h4>
                <p>${deriveTripalaceLogic(pMonth, pDay, pHour)}</p>
            </div>
        `;
    }

    // 三才生剋推演邏輯
    function deriveTripalaceLogic(pm, pd, ph) {
        return `起卦天盤得 <strong>${pm.name}</strong>（${pm.element}），地盤得 <strong>${pd.name}</strong>（${pd.element}），落點人盤於 <strong>${ph.name}</strong>（${ph.element}）。<br>` +
               `最終應驗以人盤（時宮）為核心，配合天時地利生剋推演：${ph.desc} 總體時空位能呈現「${pm.nature} → ${pd.nature} → <strong>${ph.nature}</strong>」之交替走勢，宜順應${ph.element}性動態進行決策佈局。`;
    }
</script>

</body>
</html>
