<!-- 雙盤並列/上下分區容器 -->
<div class="dual-plate-container">

    <!-- 【盤一】九宮小六壬動態盤 -->
    <div class="plate-box">
        <div class="plate-title">
            <span>【小六壬時空軌跡盤】</span>
            <small>月/日/時 三步落宮</small>
        </div>
        <div class="grid-3x3" id="boardXiaoliuren">
            <!-- 9 個格子：僅渲染 小六壬 宮名、神煞、五行與軌跡標記 -->
        </div>
    </div>

    <!-- 【盤二】奇門遁甲洛書立體盤 -->
    <div class="plate-box">
        <div class="plate-title">
            <span>【奇門遁甲洛書局象盤】</span>
            <small id="qimenJuInfo">陽遁八局 · 直符天心 · 直使開門</small>
        </div>
        <div class="grid-3x3" id="boardQimen">
            <!-- 9 個格子：渲染 奇門八神、九星、八門、天盤干、地盤干 -->
        </div>
    </div>

</div>

<style>
    .dual-plate-container {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        margin-top: 20px;
    }

    @media (max-width: 960px) {
        .dual-plate-container { grid-template-columns: 1fr; }
    }

    .plate-box {
        background: rgba(18, 22, 31, 0.9);
        border: 1px solid #2a3447;
        border-radius: 10px;
        padding: 16px;
    }

    .plate-title {
        color: #d4af37;
        font-weight: bold;
        border-bottom: 1px solid #2a3447;
        padding-bottom: 8px;
        margin-bottom: 12px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .grid-3x3 {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        aspect-ratio: 1;
    }

    /* 奇門單宮內部立體排版 */
    .qimen-cell {
        background: #141a24;
        border: 1px solid #2a3447;
        border-radius: 6px;
        padding: 6px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        font-size: 0.8rem;
    }

    .qimen-top { display: flex; justify-content: space-between; color: #88c0d0; font-weight: bold; } /* 八神 */
    .qimen-mid { display: flex; justify-content: space-between; color: #e5e9f0; } /* 九星 + 八門 */
    .qimen-bot { display: flex; justify-content: flex-end; gap: 6px; font-weight: bold; color: #d8dee9; } /* 天盤干 / 地盤干 */
</style>
